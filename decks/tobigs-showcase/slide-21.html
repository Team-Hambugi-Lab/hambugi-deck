<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }

h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }

b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }

<body><div class="strip"><p class="label">04 빅콘 · DECISION</p><p class="label">21 / 47</p></div><div style="margin-top:14pt;"><h1>사회적 고립 예방 · 대응 AI 에이전트</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:1.2fr 1fr; gap:28pt; align-items:start;"><div><p class="label red">DECISION · 9/20</p><p style="font-size:16pt; margin-top:6pt;">빅콘테스트 AI데이터활용 분야<br>SK텔레콤 유동인구 × 신한카드 결제</p><p class="small" style="margin-top:12pt;">주제와 타겟을 먼저 정하지 않고, <b>EDA 결과를 보고 결정</b>하기로 했다.</p><p class="cap" style="margin-top:8pt;">1차 서류 평가는 아이디어 창의성과 데이터 근거가 각 25점</p></div><div><p class="label">에이전트 흐름 초안</p><ul><li class="hair" style="padding:5pt 0;">위험 신호 탐지</li><li class="hair" style="padding:5pt 0;">위험 요인 분석</li><li class="hair" style="padding:5pt 0;">복지자원 검색</li><li class="hair" style="padding:5pt 0;">맞춤형 개입안 제안</li><li class="hair" style="padding:5pt 0;">담당자 검토 · 사후 모니터링</li></ul></div></div></div></body></html>
