<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 28pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.55; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">04 빅콘 · WORKFLOW</p><p class="label">28 / 47</p></div><div style="margin-top:14pt;"><h1>일하는 방식을 먼저 정했다</h1><p class="muted" style="font-size:14pt; margin-top:4pt;">10/8 주제설명자료가 갱신되며 탐지부터 복지자원 추천까지가 요구사항이 됐다</p><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14pt;"><div class="dark" style="padding-top:8pt;"><p class="label red">ISSUE</p><h3 style="margin-top:4pt;">이슈로 쪼갠다</h3><p class="small" style="margin-top:4pt;">작업마다 이슈를 열고 담당자, 산출물, 드라이브 위치까지 본문에 적었다</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">BRANCH</p><h3 style="margin-top:4pt;">설계 문서부터</h3><p class="small" style="margin-top:4pt;">이슈 헬퍼가 붙여 준 브랜치에서 설계 문서를 먼저 쓰고 시작했다</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">CI</p><h3 style="margin-top:4pt;">테스트를 분리</h3><p class="small" style="margin-top:4pt;">실데이터 없는 CI에서 깨지던 테스트를 pytest 마커로 분리했다</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">WIKI</p><h3 style="margin-top:4pt;">근거는 위키로</h3><p class="small" style="margin-top:4pt;">고립 연구와 조례 자료를 레포 위키로 공유했다</p></div></div></div></body></html>
