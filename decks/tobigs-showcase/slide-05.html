<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 36pt 48pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.16em; color: #888888; }
.num { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; }
.rule { width: 60pt; height: 2pt; background: #E63030; margin: 14pt 0 18pt; }
h1 { font-size: 32pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.6; }
.muted { color: #888888; }
.red { color: #E63030; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">01 탐색 · WEEK 1–2</p><p class="label">05 / 17</p></div><div style="margin-top:22pt;"><h1>두 대회를 동시에 뒤졌다</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:16pt;"><div style="display:grid; grid-template-columns:repeat(3,1fr); gap:24pt;"><div class="dark" style="padding-top:10pt;"><p class="label red">데이터안심구역</p><h3 style="margin-top:6pt;">수상작부터 분석</h3><p style="margin-top:6pt;">단일 vs 결합 데이터, 수도권 센터 조건, 방문 일수 평가, 반출 방식까지 확인</p></div><div class="dark" style="padding-top:10pt;"><p class="label red">9/17 하루</p><h3 style="margin-top:6pt;">주제를 쏟아냈다</h3><p style="margin-top:6pt;">감각부하 기상도 · 신경다양 아동 가족 · 디지털 취약계층 · 식품사막 · 상권 문턱값 · 독거노인 매칭</p></div><div class="dark" style="padding-top:10pt;"><p class="label red">빅콘테스트</p><h3 style="margin-top:6pt;">제공 주제 검토</h3><p style="margin-top:6pt;">대회 개요·제출 양식·역대 수상작을 정리하고 제공 데이터 명세를 비교</p></div></div></div></body></html>
