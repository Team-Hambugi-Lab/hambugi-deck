<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; word-break: keep-all; overflow-wrap: break-word; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 24pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14pt; font-weight: 700; line-height: 1.4; text-wrap: balance; }
p, li { font-size: 12pt; line-height: 1.6; text-wrap: pretty; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 10pt; color: #888888; line-height: 1.5; }
.small { font-size: 11pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 11pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">03 빅콘 · TROUBLESHOOTING</p><p class="label">18 / 22</p></div><div style="margin-top:14pt;"><h1>보류를 쪼개고, 테마를 나눴다</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:1fr 1.2fr; gap:28pt; align-items:start;"><div><table><colgroup><col style="width:40%"><col style="width:60%"></colgroup><tr><th><p class="small"><b>종사자 ÷ 거주자</b></p></th><th><p class="small"><b>v3 처리</b></p></th></tr><tr><td><p class="small">1 이하</p></td><td><p class="small">주거형 · 등급 그대로</p></td></tr><tr><td><p class="small">1 ~ 5</p></td><td><p class="small">혼합형 · 등급 유지 + 혼합지 라벨</p></td></tr><tr><td><p class="small">5 초과</p></td><td><p class="small">보류 · 활동 신호로만 판단</p></td></tr></table><div style="display:grid; grid-template-columns:1fr 1fr; gap:12pt; margin-top:14pt;"><div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:30pt;">291<span style="font-size:14pt;">곳</span></p><p class="cap">v2 보류</p></div><div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:30pt;">약 70<span style="font-size:14pt;">곳</span></p><p class="cap">v3 보류</p></div></div></div><div><img src="./assets/map_theme.png" alt="테마 A, B 상위 집계구 지도" style="width:100%; height:180pt;"><p class="small" style="margin-top:6pt;">고령 독거(A)와 중장년 주거취약(B) 테마를 분리하고 지역 안에서 백분위를 매겼다. 두 테마 상위 지역은 절반만 겹친다.</p><p class="cap" style="margin-top:4pt;">v3.3 최종 지수 · 서울시 관심집단 비율과 순위상관 0.639</p></div></div></div><div class="prog" style="width:82%;"></div></body></html>
