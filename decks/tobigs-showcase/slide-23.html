<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 28pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.55; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">04 빅콘 · EXPLORE</p><p class="label">23 / 51</p></div><div style="margin-top:14pt;"><h1>데이터안심구역과 빅콘을 동시에 뒤졌다</h1><p class="muted" style="font-size:14pt; margin-top:4pt;">안심구역은 수상작, 센터별 데이터, 방문 조건까지 정리</p><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:repeat(3,1fr); column-gap:22pt;"><div class="hair" style="padding:8pt 0;"><h3 style="font-size:14pt;">감각부하 기상도</h3><p class="small muted">환승역 시간대별 감각 부하 예측</p></div><div class="hair" style="padding:8pt 0;"><h3 style="font-size:14pt;">신경다양 아동 가족</h3><p class="small muted">생활권 이용 장벽과 부담 낮은 코스</p></div><div class="hair" style="padding:8pt 0;"><h3 style="font-size:14pt;">디지털 취약계층</h3><p class="small muted">대면 창구 공백 지역 스크리닝</p></div><div class="hair" style="padding:8pt 0;"><h3 style="font-size:14pt;">상권 문턱값</h3><p class="small muted">중심지 이론 기반 최소 수요 산정</p></div><div class="hair" style="padding:8pt 0;"><h3 style="font-size:14pt;">식품사막</h3><p class="small muted">생활 필수시설 접근 공백</p></div><div class="hair" style="padding:8pt 0;"><h3 style="font-size:14pt;">독거노인 매칭</h3><p class="small muted">고령 1인가구끼리 연결</p></div></div><p class="cap" style="margin-top:14pt;">9/17 하루 아이데이션 후보. 데이터로 증명할 수 있는지부터 따졌다</p></div><div class="prog" style="width:45%;"></div></body></html>
