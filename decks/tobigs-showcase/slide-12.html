<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 36pt 48pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.16em; color: #888888; }
.num { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; }
.rule { width: 60pt; height: 2pt; background: #E63030; margin: 14pt 0 18pt; }
h1 { font-size: 32pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.6; }
.muted { color: #888888; }
.red { color: #E63030; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">03 분석 · RESULT</p><p class="label">12 / 17</p></div><div style="margin-top:22pt;"><h1>동 평균은 집계구 안의 차이를 가린다</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:16pt;">
<div style="display:grid; grid-template-columns:1fr 1fr; gap:32pt;">
  <div><p class="label red">역삼2동 1인가구 비율</p>
  <div style="display:flex; align-items:baseline; gap:12pt; margin-top:6pt;">
  <p class="num" style="font-size:56pt; line-height:1.4;">36.5%</p><p class="muted">동 평균</p></div>
  <p style="margin-top:4pt;">같은 동 안에서도 집계구에 따라 <b>60% 이상</b>과 <b>10% 미만</b>이 나란히 있다.</p></div>
  <div><ul>
  <li class="hair" style="padding:8pt 0;"><b>60대 이상</b> 활동 저하 신호는 유효<br><span class="muted">외부 대조 8개 모두 예상 방향</span></li>
  <li class="hair" style="padding:8pt 0;"><b>20–30대</b>는 그대로 쓰기 어려움</li>
  <li class="hair" style="padding:8pt 0;">통신 관심집단으로 지수 외부 검증<br><span class="muted">강남 22개 동</span></li>
  </ul></div>
</div></div></body></html>
