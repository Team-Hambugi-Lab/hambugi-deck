<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 28pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.55; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">06 회고 · NUMBERS</p><p class="label">46 / 50</p></div><div style="margin-top:14pt;"><h1>숫자로 본 8주</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16pt;">
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">8<span style="font-size:16pt;">주</span></p><p class="cap">심화세션</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">3<span style="font-size:16pt;">개</span></p><p class="cap">참가한 공모전</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">20<span style="font-size:16pt;">개</span></p><p class="cap">전수 검증한 제공 데이터 파일</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">229<span style="font-size:16pt;">개</span></p><p class="cap">빅콘 레포 커밋</p></div>
</div>
<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16pt; margin-top:18pt;">
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">1,101<span style="font-size:16pt;"></span></p><p class="cap">비자 공통 스키마 레코드</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">407<span style="font-size:16pt;">개</span></p><p class="cap">비자 데이터 자동 검증 테스트</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">1,698<span style="font-size:16pt;"></span></p><p class="cap">분석한 집계구</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:40pt;">17,925<span style="font-size:16pt;"></span></p><p class="cap">연결한 복지 · 공공기관</p></div>
</div></div><div class="prog" style="width:92%;"></div></body></html>
