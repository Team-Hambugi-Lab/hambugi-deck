<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; word-break: keep-all; overflow-wrap: break-word; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 24pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14pt; font-weight: 700; line-height: 1.4; text-wrap: balance; }
p, li { font-size: 12pt; line-height: 1.6; text-wrap: pretty; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 10pt; color: #888888; line-height: 1.5; }
.small { font-size: 11pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 11pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">02 비자부기 · PIPELINE</p><p class="label">16 / 51</p></div><div style="margin-top:14pt;"><h1>매달 올라오는 공고를 자동으로 반영</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:repeat(5,1fr); gap:10pt;"><div class="dark" style="padding-top:8pt;"><p class="label red">01 분류</p><p class="small" style="margin-top:4pt;">새 공고를 비자 유형별로 자동 분류</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">02 추출</p><p class="small" style="margin-top:4pt;">HWPX에서 요건 · 절차 · 쿼터 추출</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">03 비교</p><p class="small" style="margin-top:4pt;">기존 데이터와 차이 비교</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">04 리포트</p><p class="small" style="margin-top:4pt;">변경 내용을 검토 리포트로 생성</p></div><div class="redtop" style="padding-top:8pt;"><p class="label red">05 사람 검토</p><p class="small" style="margin-top:4pt;">DB는 자동 수정하지 않고 사람이 확인 후 반영</p></div></div><p class="small" style="margin-top:20pt;">실제 F-4-R 공고문으로 정상 케이스와 변경 케이스 모두 전 구간 검증</p><p class="cap" style="margin-top:4pt;">자격 판정은 AI가 임의로 하지 않고, 검수된 규칙과 공식기관 확인을 기준으로</p></div><div class="prog" style="width:31%;"></div></body></html>
