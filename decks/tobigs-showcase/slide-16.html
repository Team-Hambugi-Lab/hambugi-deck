<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 36pt 48pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.16em; color: #888888; }
.num { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; }
.rule { width: 60pt; height: 2pt; background: #E63030; margin: 14pt 0 18pt; }
h1 { font-size: 32pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.6; }
.muted { color: #888888; }
.red { color: #E63030; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">05 회고</p><p class="label">16 / 17</p></div><div style="margin-top:22pt;"><h1>이슈로 쪼개고, AI로 속도를 냈다</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:16pt;">
<div style="display:grid; grid-template-columns:1fr 1.3fr; gap:36pt;">
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12pt;">
    <div class="dark" style="padding-top:8pt;"><p class="num" style="font-size:40pt;">7</p><p class="cap">주</p></div>
    <div class="dark" style="padding-top:8pt;"><p class="num" style="font-size:40pt;">21</p><p class="cap">이슈</p></div>
    <div class="dark" style="padding-top:8pt;"><p class="num" style="font-size:40pt;">229</p><p class="cap">커밋</p></div>
  </div>
  <div><ul>
  <li class="hair" style="padding:7pt 0;"><b>방식</b>&nbsp; GitHub 이슈·PR · 공유 드라이브 · Claude Code·Codex</li>
  <li class="hair" style="padding:7pt 0;"><b>잘한 점</b>&nbsp; <span class="muted">TODO 팀원 의견</span></li>
  <li class="hair" style="padding:7pt 0;"><b>아쉬운 점</b>&nbsp; <span class="muted">TODO 팀원 의견</span></li>
  </ul></div>
</div></div></body></html>
