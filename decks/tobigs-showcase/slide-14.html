<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 28pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.55; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">02 데이터 이해 · WEEK 4</p><p class="label">14 / 34</p></div><div style="margin-top:14pt;"><h1>분석 단위를 집계구로 맞췄다</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16pt;">
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:32pt;">1,698<span style="font-size:16pt;"></span></p><p class="cap">분석 대상 집계구 (강남 + 춘천)</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:32pt;">297<span style="font-size:16pt;"></span></p><p class="cap">SGIS 집계구 통계 항목</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:32pt;">184<span style="font-size:16pt;"></span></p><p class="cap">분석에 쓸 항목만 남긴 결과</p></div>
  <div class="dark" style="padding-top:6pt;"><p class="num" style="font-size:32pt;">6<span style="font-size:16pt;"></span></p><p class="cap">최종 위험 요인 지표</p></div>
</div>
<p class="small" style="margin-top:22pt;">인구 71 · 가구 8 · 주택 36 · 사업체 182개 항목을 집계구 마스터 테이블 하나로 결합하고, 결측과 no_record 처리 규칙을 팀 공통으로 정했다.</p></div></body></html>
