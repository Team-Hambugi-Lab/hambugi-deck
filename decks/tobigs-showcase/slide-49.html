<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; word-break: keep-all; overflow-wrap: break-word; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 24pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14pt; font-weight: 700; line-height: 1.4; text-wrap: balance; }
p, li { font-size: 12pt; line-height: 1.6; text-wrap: pretty; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 10pt; color: #888888; line-height: 1.5; }
.small { font-size: 11pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 11pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">04 회고 · TOGETHER</p><p class="label">49 / 50</p></div><div style="margin-top:14pt;"><h1>함께한 8주</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8pt 10pt;"><div><img src="./assets/photos/photo-1.jpg" alt="1주차 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">1주차</p></div><div><img src="./assets/photos/photo-2.jpg" alt="3주차 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">3주차</p></div><div><img src="./assets/photos/photo-3.jpg" alt="4주차 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">4주차</p></div><div><img src="./assets/photos/photo-4.jpg" alt="5주차 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">5주차</p></div><div><img src="./assets/photos/photo-5.jpg" alt="9/17 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">9/17</p></div><div><img src="./assets/photos/photo-6.jpg" alt="9/20 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">9/20</p></div><div><img src="./assets/photos/photo-7.jpg" alt="6주차 팀 활동 사진" style="width:100%; height:96pt; object-fit:cover;"><p class="cap" style="margin-top:3pt;">6주차</p></div><div style="display:flex; align-items:center; justify-content:center;"><p class="small muted">함께 작업하던 날들</p></div></div></div><div class="prog" style="width:98%;"></div></body></html>
