<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; word-break: keep-all; overflow-wrap: break-word; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 24pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14pt; font-weight: 700; line-height: 1.4; text-wrap: balance; }
p, li { font-size: 12pt; line-height: 1.6; text-wrap: pretty; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 10pt; color: #888888; line-height: 1.5; }
.small { font-size: 11pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 11pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">CONTENTS</p><p class="label">03 / 50</p></div><div style="margin-top:14pt;"><h1>목차</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div class="hair" style="display:grid; grid-template-columns:44pt 1.3fr 1.3fr 64pt; align-items:baseline; padding:5pt 0;"><p class="num red" style="font-size:16pt;">01</p><h3 style="font-size:13pt;">데이터 엔지니어링 학습</h3><p class="muted small">개념부터 나눠서 발표</p><p class="cap" style="text-align:right;">1주차</p></div><div class="hair" style="display:grid; grid-template-columns:44pt 1.3fr 1.3fr 64pt; align-items:baseline; padding:5pt 0;"><p class="num red" style="font-size:16pt;">02</p><h3 style="font-size:13pt;">ICT 공모전 · 비자부기</h3><p class="muted small">공공 문서를 서비스 데이터로</p><p class="cap" style="text-align:right;">2~4주차</p></div><div class="hair" style="display:grid; grid-template-columns:44pt 1.3fr 1.3fr 64pt; align-items:baseline; padding:5pt 0;"><p class="num red" style="font-size:16pt;">03</p><h3 style="font-size:13pt;">빅콘테스트</h3><p class="muted small">문제 정의, 해결, 트러블슈팅</p><p class="cap" style="text-align:right;">5~8주차</p></div><div class="hair" style="display:grid; grid-template-columns:44pt 1.3fr 1.3fr 64pt; align-items:baseline; padding:5pt 0;"><p class="num red" style="font-size:16pt;">04</p><h3 style="font-size:13pt;">회고</h3><p class="muted small">결과와 배운 점</p><p class="cap" style="text-align:right;"></p></div></div><div class="prog" style="width:6%;"></div></body></html>
