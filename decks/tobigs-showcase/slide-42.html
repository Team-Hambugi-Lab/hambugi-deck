<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 28pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.55; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">05 에이전트 · SCENARIO</p><p class="label">42 / 50</p></div><div style="margin-top:14pt;"><h1>29세, 역삼1동, 1인가구</h1><p class="muted" style="font-size:14pt; margin-top:4pt;">한 사람의 사이클로 본 에이전트</p><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:repeat(5,1fr); gap:12pt;"><div class="dark" style="padding-top:8pt;"><p class="label ">온보딩</p><p class="small" style="margin-top:6pt;">"1년 넘게 거의 안 나갔어요"</p><p class="cap" style="margin-top:6pt;">OUT · ECON · HOUSE, 티어 2</p></div><div class="dark" style="padding-top:8pt;"><p class="label ">추천</p><p class="small" style="margin-top:6pt;">"상담 해볼게요"</p><p class="cap" style="margin-top:6pt;">고립 전담기관 안내</p></div><div class="dark" style="padding-top:8pt;"><p class="label ">관찰</p><p class="small" style="margin-top:6pt;">"요즘 잠을 잘 못 자요"</p><p class="cap" style="margin-top:6pt;">평소 상태 기록</p></div><div class="redtop" style="padding-top:8pt;"><p class="label red">위기 감지</p><p class="small" style="margin-top:6pt;">"사라지고 싶다는 생각이 들어요"</p><p class="cap" style="margin-top:6pt;">즉시 사람 연결</p></div><div class="dark" style="padding-top:8pt;"><p class="label ">후속</p><p class="small" style="margin-top:6pt;">"센터에 두 번 다녀왔어요"</p><p class="cap" style="margin-top:6pt;">이용 확인 후 재분류</p></div></div><p class="cap" style="margin-top:20pt;">합성 페르소나 예시. 퇴사 후 1년 넘게 집에 있고, 생활비가 걱정이고, 속마음을 말할 사람이 없다.</p></div></body></html>
