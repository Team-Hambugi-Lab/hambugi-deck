<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 28pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
h2 { font-size: 20pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 16pt; font-weight: 700; line-height: 1.4; }
p, li { font-size: 14pt; line-height: 1.55; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 12pt; color: #888888; line-height: 1.5; }
.small { font-size: 12pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 12pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label">04 빅콘 · INDEX v0</p><p class="label">25 / 47</p></div><div style="margin-top:14pt;"><h1>지표를 합치기 전에, 같은 걸 재는지부터</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:1fr 1fr; gap:28pt; align-items:start;"><div><p class="label red">김태은 · 지표 재설계</p><div style="display:flex; align-items:baseline; gap:14pt; margin-top:6pt;"><p class="num" style="font-size:40pt;">-4.219</p><p class="muted">에서</p><p class="num red" style="font-size:40pt;">0.720</p></div><p class="small" style="margin-top:6pt;">서울연구원 4축을 빌린 1차 지수는 Cronbach α가 음수. 지표들이 고립이 아니라 <b>구매력</b>을 재고 있었다. 정의, 예측, 검증 순서로 다시 설계했다.</p></div><div><p class="label red">이정연 · 재현 검증</p><div style="display:flex; align-items:baseline; gap:14pt; margin-top:6pt;"><p class="num" style="font-size:40pt;">0.185</p><p class="muted">vs</p><p class="num red" style="font-size:40pt;">0.589</p></div><p class="small" style="margin-top:6pt;">같은 지수를 보고서만 보고 재현했더니 α가 달랐다. 원인은 <b>주말비 변수의 부호 하나</b>. 가정을 문서로 맞추는 게 코드보다 먼저였다.</p></div></div></div></body></html>
