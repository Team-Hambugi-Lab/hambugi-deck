<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; word-break: keep-all; overflow-wrap: break-word; }
body { width: 720pt; height: 405pt; background: #FFFFFF; color: #1A1A1A;
  font-family: 'Pretendard', sans-serif; padding: 32pt 44pt; display: flex; flex-direction: column; }
.strip { display: flex; justify-content: space-between; align-items: center; }
.label { font-size: 10pt; font-weight: 600; letter-spacing: 0.14em; color: #888888; }
.num { font-family: 'Pretendard', sans-serif; font-weight: 800; letter-spacing: -0.02em; color: #1F3A6E; line-height: 1.4; padding-bottom: 2pt; }
.rule { width: 48pt; height: 2pt; background: #1F3A6E; margin: 10pt 0 0; }
h1 { font-size: 24pt; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 18pt; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14pt; font-weight: 700; line-height: 1.4; text-wrap: balance; }
p, li { font-size: 12pt; line-height: 1.6; text-wrap: pretty; }
b { font-weight: 700; }
.muted { color: #888888; }
.red { color: #1F3A6E; }
.cap { font-size: 10pt; color: #888888; line-height: 1.5; }
.small { font-size: 11pt; line-height: 1.5; }
ul { list-style: none; }
.hair { border-top: 1pt solid #BBBBBB; }
.dark { border-top: 2pt solid #1A1A1A; }
.redtop { border-top: 2pt solid #1F3A6E; }
.chip { display: inline-block; background: #1F3A6E; color: #FFFFFF; padding: 3pt 8pt; border-radius: 2pt; }
.prog { position: absolute; left: 0; bottom: 0; height: 4pt; background: #1F3A6E; }
body { position: relative; }
img { display: block; object-fit: contain; }
table { border-collapse: collapse; width: 100%; }
td, th { font-size: 11pt; padding: 5pt 6pt; text-align: left; border-top: 1pt solid #BBBBBB; }
th { font-weight: 700; border-top: 2pt solid #1A1A1A; }
</style>
</head>
<body><div class="strip"><p class="label chip" style="color:#FFFFFF;">방법 · 구조</p><p class="label">08 / 15</p></div><div style="margin-top:14pt;"><h1>두 개의 신호를 교차한다</h1><div class="rule"></div></div><div style="flex:1; display:flex; flex-direction:column; justify-content:center;"><div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14pt;"><div class="dark" style="padding-top:8pt;"><p class="label red">STEP 1 · 어디가 위험한가</p><h3 style="margin-top:4pt;">고립 위험 지수</h3><p class="small" style="margin-top:4pt;">SGIS 6개 지표, 고령 독거 · 중장년 주거취약 두 테마</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">STEP 2 · 누가 줄었나</p><h3 style="margin-top:4pt;">활동 저하 신호</h3><p class="small" style="margin-top:4pt;">기대 유동 회귀의 잔차가 6개월 중 4개월 이상 -0.1 미만</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">DICTIONARY</p><h3 style="margin-top:4pt;">위험 특징 사전</h3><p class="small" style="margin-top:4pt;">실태조사 근거로 대화에서 확인할 24개 특징</p></div><div class="dark" style="padding-top:8pt;"><p class="label red">RESOURCE</p><h3 style="margin-top:4pt;">기관 태그</h3><p class="small" style="margin-top:4pt;">복지 · 공공기관 17,925곳을 서비스 태그 16종으로</p></div></div>
<div style="margin-top:20pt; background:#1F3A6E; padding:11pt 16pt;">
<p style="color:#FFFFFF; font-size:14pt; font-weight:700;">지역 유형으로 관찰하고, 대화로 판단하고, 기관으로 연결하는 AI 에이전트</p></div></div><div class="prog" style="width:53%;"></div></body></html>
